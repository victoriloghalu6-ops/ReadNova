<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order confirmed — ReadNova</title>
<link rel="stylesheet" href="style.css">
<style>
.thanks{min-height:78vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 22px;gap:6px}
.thanks h1{font:2.6rem/1.1 'Playfair Display',serif;margin:0;letter-spacing:-1px}
.thanks p{color:#777182;max-width:440px;line-height:1.8;margin:10px 0 0}
.thanks .primary-btn{margin-top:26px}
.tick{width:52px;height:52px;display:grid;place-items:center;border-radius:16px;background:#e9f8ef;color:#1c8a4d;margin-bottom:14px}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="./"><span class="brand-mark">R</span> Read<span>Nova</span></a>
  <nav><a href="./">Explore books</a></nav>
  <a class="cart-pill" href="./">Back to library</a>
</header>
<main class="thanks">
  <div class="tick"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
  <p class="eyebrow">VERIFIED · ORDER CONFIRMED</p>
  <h1>Thank you.</h1>
  <p>Your payment is confirmed and your ebook is being prepared. Watch your inbox — we'll email delivery details shortly.</p>
  <a class="primary-btn" href="./">Browse more stories <span>↘</span></a>
</main>
</body>
</html>
